services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zhuatech_procureflow
      MYSQL_USER: procureflow
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8097}:8080']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      retries: 20
    restart: unless-stopped
volumes:
  mysql-data:
