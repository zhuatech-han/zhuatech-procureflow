spring:
  datasource:
    url: jdbc:h2:mem:procureflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate.globally_quoted_identifiers: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
procureflow:
  admin-password: ${TEST_ADMIN_PASSWORD}
